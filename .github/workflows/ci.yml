name: Deploy to GHCR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  build-and-deploy-pocketbase:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      
      - name: Preset Image SHA
        run: echo "IMAGE_SHA=$(echo ${{ github.sha }} | cut -c1-7 | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      
      - name: Preset Pocketbase Image URL
        run: echo "POCKETBASE_IMAGE_URL=$(echo ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-pocketbase:${{ env.IMAGE_SHA }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      
      - name: Build and publish Docker image for Pocketbase
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image for Pocketbase
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.POCKETBASE_IMAGE_URL }}
          build-args: |
            APP_VERSION=${{ env.IMAGE_SHA }}

      - name: Deploy Pocketbase Image to CapRover
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.base_ref == 'main')
        uses: caprover/deploy-from-github@v2
        with:
          server: "${{ secrets.CAPROVER_SERVER }}"
          app: "${{ secrets.APP_POCKETBASE_NAME }}"
          token: "${{ secrets.APP_POCKETBASE_TOKEN }}"
          image: ${{ env.POCKETBASE_IMAGE_URL }}
